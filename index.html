<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root {
    color-scheme: light dark;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: transparent;
    color: inherit;
}

/* =======================
   QUESTIONS CONTAINER
======================= */

#questions {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

/* =======================
   QUESTION CARD
======================= */

.question-card {
    padding-bottom: 10px;
}

.question-header {
    display: flex;
    align-items: flex-start;
    gap: 4px;
}

.question-display {

    flex: 1;

    font-size: 16px;
    line-height: 1.55;

    white-space: pre-wrap;
    word-break: break-word;
}

/* =======================
   MENU
======================= */

.menu-wrapper {
    position: relative;

    opacity: 0;

    transition: opacity .15s ease;
}

.question-header:hover .menu-wrapper {
    opacity: 1;
}

.menu-button {

    border: none;
    background: transparent;

    color: inherit;

    cursor: pointer;

    font-size: 16px;

    padding: 0 4px;

    border-radius: 4px;

    opacity: .45;
}

.menu-button:hover {

    opacity: 1;

    background:
        rgba(128,128,128,.08);
}

.menu {

    position: absolute;

    right: 0;
    top: 22px;

    display: none;

    min-width: 180px;

    border-radius: 8px;

    overflow: hidden;

    background:
        rgb(38,38,38);

    box-shadow:
        0 10px 24px rgba(0,0,0,.25);

    z-index: 1000;
}

.menu.open {
    display: block;
}

.menu-item {

    width: 100%;

    border: none;
    background: transparent;

    color: white;

    text-align: left;

    cursor: pointer;

    padding: 10px 12px;

    font-size: 14px;
}

.menu-item:hover {
    background:
        rgba(255,255,255,.08);
}

/* =======================
   QUESTION EDITOR
======================= */

.question-edit-container {
    display: none;
}

.question-editor {

    width: 100%;

    min-height: 90px;

    margin-top: 6px;

    padding: 10px;

    border: 1px solid rgba(128,128,128,.2);

    border-radius: 6px;

    background: transparent;
    color: inherit;

    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;

    resize: vertical;
}

.edit-actions {

    margin-top: 8px;

    display: flex;
    gap: 8px;
}

/* =======================
   ANSWER BOX
======================= */

.answer-box {

    width: 100%;

    min-height: 120px;

    margin-top: 6px;

    border: none;
    outline: none;

    background: transparent;
    color: inherit;

    font-family: inherit;

    font-size: 15px;
    line-height: 1.6;

    resize: vertical;
}

.answer-box::placeholder {
    opacity: .4;
}

/* =======================
   META
======================= */

.meta {

    margin-top: 4px;

    font-size: 12px;
    opacity: .55;
}

.separator {

    margin-top: 10px;

    border-bottom:
        1px solid rgba(128,128,128,.12);
}

/* =======================
   BUTTONS
======================= */

.action-btn {

    border: 1px solid rgba(128,128,128,.25);

    background: transparent;
    color: inherit;

    padding: 7px 11px;

    border-radius: 6px;

    cursor: pointer;
}

.action-btn:hover {

    background:
        rgba(128,128,128,.08);
}


.actions {

    margin-top: 18px;

    display: flex;
    gap: 8px;
}

.empty-message {

    opacity: .55;
    font-size: 14px;
}

</style>
</head>
<body>

<div id="questions"></div>

<div class="actions">

    <button
        class="action-btn"
        onclick="addQuestion()">
        + Add Question
    </button>

</div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const lessonId =
    params.get("id") || "default";

const STORAGE_KEY =
    `lesson-${lessonId}`;

let data =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function wordCount(text) {

    const trimmed =
        text.trim();

    return trimmed
        ? trimmed.split(/\s+/).length
        : 0;
}

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}

function closeAllMenus() {

    document
        .querySelectorAll(".menu")
        .forEach(menu =>
            menu.classList.remove(
                "open"
            )
        );
}

function render() {

    const container =
        document.getElementById(
            "questions"
        );

    container.innerHTML = "";

    if (data.length === 0) {

        container.innerHTML =
            '<div class="empty-message">Click "Add Question" to begin.</div>';

        return;
    }

    data.forEach((item,index)=>{

        const card =
            document.createElement("div");

        card.className =
            "question-card";

        card.innerHTML = `

<div class="question-header">

    <div
        id="display-${index}"
        class="question-display">
        ${escapeHtml(item.question)}
    </div>

    <div class="menu-wrapper">

        <button
            class="menu-button"
            onclick="toggleMenu(event,${index})">
            ⋯
        </button>

        <div
            id="menu-${index}"
            class="menu">

            <button
                class="menu-item"
                onclick="startEdit(${index})">
                Edit Question
            </button>

            <button
                class="menu-item"
                onclick="duplicateQuestion(${index})">
                Duplicate
            </button>

            <button
                class="menu-item"
                onclick="moveUp(${index})">
                Move Up
            </button>

            <button
                class="menu-item"
                onclick="moveDown(${index})">
                Move Down
            </button>

            <button
                class="menu-item"
                onclick="deleteQuestion(${index})">
                Delete
            </button>

        </div>

    </div>

</div>

<div
    id="edit-${index}"
    class="question-edit-container">

    <textarea
        id="input-${index}"
        class="question-editor"
    >${escapeHtml(item.question)}</textarea>

    <div class="edit-actions">

        <button
            class="action-btn"
            onclick="saveQuestion(${index})">
            Save
        </button>

        <button
            class="action-btn"
            onclick="cancelEdit(${index})">
            Cancel
        </button>

    </div>

</div>

<textarea
    class="answer-box"
    placeholder="Type your answer here..."
    oninput="updateAnswer(${index}, this.value)"
>${escapeHtml(item.answer)}</textarea>

<div class="meta">
    ${wordCount(item.answer)} words
</div>

<div class="separator"></div>

`;

        container.appendChild(card);
    });

}

function toggleMenu(event,index){

    event.stopPropagation();

    const menu =
        document.getElementById(
            `menu-${index}`
        );

    const isOpen =
        menu.classList.contains(
            "open"
        );

    closeAllMenus();

    if (!isOpen) {
        menu.classList.add("open");
    }
}

function startEdit(index){

    closeAllMenus();

    document.getElementById(
        `display-${index}`
    ).style.display =
        "none";

    document.getElementById(
        `edit-${index}`
    ).style.display =
        "block";
}

function saveQuestion(index){

    const value =
        document
            .getElementById(
                `input-${index}`
            )
            .value
            .trim();

    if (!value) return;

    data[index].question =
        value;

    saveData();

    closeAllMenus();

    render();
}

function cancelEdit(index){

    closeAllMenus();

    render();
}

function updateAnswer(index,value){

    data[index].answer =
        value;

    saveData();

    const metas =
        document.querySelectorAll(
            ".meta"
        );

    if (metas[index]) {

        metas[index].textContent =
            `${wordCount(value)} words`;
    }
}

function addQuestion(){

    data.push({
        question: "New Question",
        answer: ""
    });

    saveData();

    render();

    startEdit(
        data.length - 1
    );
}

function deleteQuestion(index){

    closeAllMenus();

    if (
        !confirm(
            "Delete this question?"
        )
    ) return;

    data.splice(index,1);

    saveData();
    render();
}

function duplicateQuestion(index){

    closeAllMenus();

    data.splice(
        index + 1,
        0,
        {
            question:
                data[index].question,
            answer:
                data[index].answer
        }
    );

    saveData();
    render();
}

function moveUp(index){

    closeAllMenus();

    if (index === 0) return;

    [
        data[index],
        data[index-1]
    ] =
    [
        data[index-1],
        data[index]
    ];

    saveData();
    render();
}

function moveDown(index){

    closeAllMenus();

    if (
        index >= data.length - 1
    ) return;

    [
        data[index],
        data[index+1]
    ] =
    [
        data[index+1],
        data[index]
    ];

    saveData();
    render();
}

document.addEventListener(
    "click",
    closeAllMenus
);

render();

</script>

</body>
</html>
