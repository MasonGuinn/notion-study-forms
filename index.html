<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    color-scheme: light dark;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    color: inherit;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
textarea {
    font: inherit;
}

textarea {
    overflow: hidden;
}

#app {
    padding: 4px 44px 4px 20px;
}

.flashcard {
    min-width: 0;
}

.progress {
    margin-bottom: 5px;
    color: inherit;
    font-size: 12px;
    opacity: .55;
}

.section-header {
    display: none;
    margin-bottom: 5px;
    border-bottom: 1px solid rgba(128, 128, 128, .18);
    padding-bottom: 4px;
    font-size: 13px;
    font-weight: 600;
}

.practice .section-header {
    display: block;
}

.question-row {
    position: relative;
    min-height: 28px;
    padding-right: 36px;
}

.question-display {
    padding: 2px 0;
    color: inherit;
    font-size: 16px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
}

.menu-wrapper {
    position: absolute;
    top: 0;
    right: 2px;
    opacity: 0;
    transition: opacity .12s ease;
}

.question-row:hover .menu-wrapper,
.menu-wrapper:focus-within,
.menu-wrapper.menu-visible {
    opacity: 1;
}

.menu-button {
    border: 0;
    border-radius: 4px;
    padding: 1px 5px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 17px;
    line-height: 1.2;
    opacity: .5;
}

.menu-button:hover,
.menu-button:focus-visible {
    background: rgba(128, 128, 128, .1);
    opacity: 1;
    outline: none;
}

.menu {
    position: absolute;
    top: 24px;
    right: 0;
    z-index: 10;
    display: none;
    min-width: 168px;
    overflow: hidden;
    border: 1px solid rgba(128, 128, 128, .18);
    border-radius: 6px;
    background: Canvas;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}

.menu.open {
    display: block;
}

.menu-item {
    display: block;
    width: 100%;
    border: 0;
    padding: 7px 10px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
}

.menu-item:hover,
.menu-item:focus-visible {
    background: rgba(128, 128, 128, .1);
    outline: none;
}

.answer-area {
    padding: 10px 0 0;
}

.answer-box,
.inline-editor {
    display: block;
    width: 100%;
    min-height: 24px;
    margin: 0;
    overflow: hidden;
    border: 0;
    outline: 0;
    padding: 2px 0;
    resize: none;
    background: transparent;
    color: inherit;
    font-size: 15px;
    line-height: 1.5;
}

.answer-box::placeholder {
    opacity: .4;
}

.correct-toggle {
    display: block;
    border: 0;
    padding: 7px 0 2px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 12px;
    opacity: .55;
}

.correct-toggle:hover,
.correct-toggle:focus-visible {
    opacity: .9;
    outline: none;
    text-decoration: underline;
}

.correct-answer {
    display: none;
    padding: 2px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.45;
}

.correct-answer.visible {
    display: block;
}

.edit-container,
.editor-panel {
    display: none;
    padding: 2px 0 3px;
}

.edit-container.visible,
.editor-panel.visible {
    display: block;
}

.inline-editor {
    border: 1px solid rgba(128, 128, 128, .22);
    border-radius: 5px;
    padding: 6px 8px;
}

.edit-actions,
.navigation {
    display: flex;
    align-items: center;
    gap: 6px;
}

.edit-actions {
    margin-top: 5px;
}

.action-button {
    border: 1px solid rgba(128, 128, 128, .25);
    border-radius: 5px;
    padding: 5px 9px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 13px;
}

.action-button:hover:not(:disabled),
.action-button:focus-visible:not(:disabled) {
    background: rgba(128, 128, 128, .1);
    outline: none;
}

.action-button:disabled {
    cursor: default;
    opacity: .35;
}

.navigation {
    justify-content: space-between;
    margin-top: 12px;
}

.navigation .add-question {
    margin: 0;
}

.navigation .action-button {
    min-width: 70px;
}

.empty-message {
    padding: 4px 0;
    color: inherit;
    font-size: 13px;
    opacity: .55;
}

.add-question {
    margin-top: 8px;
}

@media (prefers-reduced-motion: reduce) {
    .menu-wrapper {
        transition: none;
    }
}
</style>
</head>
<body>

<main id="app">
    <div id="flashcard"></div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const lessonId = params.get("id") || "default";
const mode = params.get("mode") === "practice" ? "practice" : "understanding";
const STORAGE_KEY = `lesson-${lessonId}`;
const INDEX_KEY = `${STORAGE_KEY}-current-index`;

let data = [];
let currentIndex = loadCurrentIndex();
const itemLabel = mode === "practice" ? "Problem" : "Question";
const addItemLabel = `+ Add ${itemLabel}`;

function normalizeItem(item) {
    const existing = item && typeof item === "object" ? item : {};

    return {
        ...existing,
        question: typeof existing.question === "string" ? existing.question : "",
        answer: typeof existing.answer === "string" ? existing.answer : "",
        correctAnswer: typeof existing.correctAnswer === "string"
            ? existing.correctAnswer
            : "",
        section: typeof existing.section === "string" && existing.section.trim()
            ? existing.section.trim()
            : "Warm-up",
        showCorrectAnswer: existing.showCorrectAnswer === true
    };
}

function loadData() {
    const stored = localStorage.getItem(STORAGE_KEY);

    if (!stored) {
        return [];
    }

    try {
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) {
            return [];
        }

        const normalized = parsed.map(normalizeItem);
        const requiresMigration = parsed.some(item =>
            !item ||
            typeof item.section !== "string" ||
            !item.section.trim()
        );

        if (requiresMigration) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
        }

        return normalized;
    } catch (error) {
        console.error(`Unable to load lesson "${lessonId}".`, error);
        return [];
    }
}

async function loadInitialData() {
    // Seed wins on every load: when lessons.json has a seed for this
    // lesson, the seed's question, model answer, and section replace the
    // stored ones, while the user's typed answer carries over by position.
    // A lesson with no seed keeps its stored data, and a failed seed fetch
    // falls back to the stored data instead of blanking the lesson.
    // The merged list is returned in memory; it is written to storage the
    // next time the app saves (typing, navigating, or editing), as before.
    const stored = loadData();

    try {
        const response = await fetch("lessons.json");

        if (!response.ok) {
            return stored;
        }

        const seeds = await response.json();
        const seeded = seeds ? seeds[lessonId] : null;

        if (!Array.isArray(seeded)) {
            return stored;
        }

        return seeded.map((seedItem, index) => {
            const normalizedSeed = normalizeItem(seedItem);
            const typedAnswer =
                stored[index] && typeof stored[index].answer === "string"
                    ? stored[index].answer
                    : "";
            return {
                ...normalizedSeed,
                answer: typedAnswer
            };
        });
    } catch (error) {
        console.error(`Unable to load seed for lesson "${lessonId}".`, error);
        return stored;
    }
}

function loadCurrentIndex() {
    const storedIndex = Number.parseInt(
        localStorage.getItem(INDEX_KEY) || "0",
        10
    );

    return Number.isInteger(storedIndex) && storedIndex >= 0
        ? storedIndex
        : 0;
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function saveCurrentIndex() {
    localStorage.setItem(INDEX_KEY, String(currentIndex));
}

function closeMenu() {
    const menu = document.querySelector(".menu");
    const wrapper = document.querySelector(".menu-wrapper");

    menu?.classList.remove("open");
    wrapper?.classList.remove("menu-visible");
}

function autoGrow(textarea) {
    textarea.style.height = "0px";
    textarea.style.height = `${Math.max(textarea.scrollHeight, 24)}px`;
}

function createButton(text, className, handler) {
    const button = document.createElement("button");
    button.className = className;
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", event => {
        event.stopPropagation();
        handler();
    });
    return button;
}

function render() {
    const container = document.getElementById("flashcard");
    container.replaceChildren();

    if (data.length === 0) {
        const emptyMessage = document.createElement("div");
        emptyMessage.className = "empty-message";
        emptyMessage.textContent = `Click "${addItemLabel}" to begin.`;
        container.appendChild(emptyMessage);
        container.appendChild(
            createButton(addItemLabel, "action-button add-question", addQuestion)
        );
        return;
    }

    currentIndex = Math.min(currentIndex, data.length - 1);
    saveCurrentIndex();

    const item = data[currentIndex];
    const card = document.createElement("section");
    card.className = `flashcard${mode === "practice" ? " practice" : ""}`;

    if (mode === "practice") {
        const sectionHeader = document.createElement("div");
        sectionHeader.className = "section-header";
        sectionHeader.textContent = item.section;
        card.appendChild(sectionHeader);
    }

    const progress = document.createElement("div");
    progress.className = "progress";
    const sectionItems = mode === "practice"
        ? data.filter(candidate => candidate.section === item.section)
        : data;
    const sectionPosition = sectionItems.indexOf(item) + 1;
    progress.textContent = `${itemLabel} ${
        mode === "practice" ? sectionPosition : currentIndex + 1
    } of ${mode === "practice" ? sectionItems.length : data.length}`;

    const questionRow = document.createElement("div");
    questionRow.className = "question-row";

    const questionDisplay = document.createElement("div");
    questionDisplay.className = "question-display";
    questionDisplay.textContent = item.question;

    const menuWrapper = document.createElement("div");
    menuWrapper.className = "menu-wrapper";

    const menuButton = createButton("⋯", "menu-button", () => {
        const menu = menuWrapper.querySelector(".menu");
        const shouldOpen = !menu.classList.contains("open");
        closeMenu();

        if (shouldOpen) {
            menu.classList.add("open");
            menuWrapper.classList.add("menu-visible");
        }
    });
    menuButton.setAttribute("aria-label", "Question actions");

    const menu = document.createElement("div");
    menu.className = "menu";
    menu.append(
        createButton(
            mode === "practice" ? "Edit Problem" : "Edit Question",
            "menu-item",
            () => startEdit("question")
        ),
        createButton("Edit Correct Answer", "menu-item", () => startEdit("correctAnswer")),
        ...(mode === "practice"
            ? [createButton("Edit Section", "menu-item", () => startEdit("section"))]
            : []),
        createButton(
            mode === "practice" ? "Duplicate Problem" : "Duplicate Question",
            "menu-item",
            duplicateQuestion
        ),
        createButton("Move Up", "menu-item", () => moveQuestion(-1)),
        createButton("Move Down", "menu-item", () => moveQuestion(1)),
        createButton(
            mode === "practice" ? "Delete Problem" : "Delete Question",
            "menu-item",
            deleteQuestion
        )
    );

    menuWrapper.append(menuButton, menu);
    questionRow.append(questionDisplay, menuWrapper);

    const questionEditor = createEditor(
        item.question,
        "Edit question",
        "question",
        () => saveEdit("question")
    );
    const correctEditor = createEditor(
        item.correctAnswer,
        "Edit correct answer",
        "correctAnswer",
        () => saveEdit("correctAnswer")
    );
    const sectionEditor = createEditor(
        item.section,
        "Edit section",
        "section",
        () => saveEdit("section")
    );

    const answerArea = document.createElement("div");
    answerArea.className = "answer-area";

    const answer = document.createElement("textarea");
    answer.className = "answer-box";
    answer.placeholder = "Type your answer here...";
    answer.value = item.answer;
    answer.setAttribute("aria-label", "Answer");
    answer.addEventListener("input", event => {
        data[currentIndex].answer = event.target.value;
        saveData();
        autoGrow(answer);
    });

    const correctToggle = createButton(
        item.showCorrectAnswer
            ? "Hide Answer"
            : mode === "practice"
                ? "Show Answer"
                : "Show Sample Answer",
        "correct-toggle",
        toggleCorrectAnswer
    );

    const correctAnswer = document.createElement("div");
    correctAnswer.className = `correct-answer${item.showCorrectAnswer ? " visible" : ""}`;

    const correctText = document.createElement("span");
    correctText.textContent = item.correctAnswer;
    correctAnswer.appendChild(correctText);
    answerArea.append(answer, correctToggle, correctAnswer);

    const navigation = document.createElement("nav");
    navigation.className = "navigation";
    const addQuestionButton = createButton(
        addItemLabel,
        "action-button add-question",
        addQuestion
    );
    navigation.append(
        createButton("Previous", "action-button", () => navigate(-1)),
        addQuestionButton,
        createButton("Next", "action-button", () => navigate(1))
    );
    navigation.children[0].disabled = currentIndex === 0;
    navigation.children[2].disabled = currentIndex === data.length - 1;

    card.append(
        progress,
        questionRow,
        questionEditor.container,
        correctEditor.container,
        ...(mode === "practice" ? [sectionEditor.container] : []),
        answerArea,
        navigation
    );
    container.appendChild(card);
    autoGrow(answer);
}

function createEditor(value, label, field, saveHandler) {
    const container = document.createElement("div");
    container.className = "editor-panel";
    container.dataset.field = field;

    const editor = document.createElement("textarea");
    editor.className = "inline-editor";
    editor.value = value;
    editor.setAttribute("aria-label", label);
    editor.addEventListener("input", () => autoGrow(editor));

    const actions = document.createElement("div");
    actions.className = "edit-actions";
    actions.append(
        createButton("Save", "action-button", saveHandler),
        createButton("Cancel", "action-button", cancelEdit)
    );

    container.append(editor, actions);
    autoGrow(editor);
    return { container, editor };
}

function startEdit(type) {
    closeMenu();

    const card = document.querySelector(".flashcard");
    const container = card.querySelector(`.editor-panel[data-field="${type}"]`);
    const editor = container.querySelector("textarea");

    card.querySelector(".question-row").hidden = true;
    card.querySelector(".answer-area").hidden = true;
    card.querySelector(".navigation").hidden = true;
    container.classList.add("visible");
    autoGrow(editor);
    editor.focus();
    editor.select();
}

function saveEdit(type) {
    const card = document.querySelector(".flashcard");
    const value = card
        .querySelector(`.editor-panel[data-field="${type}"] textarea`)
        .value
        .trim();

    if ((type === "question" || type === "section") && !value) {
        return;
    }

    data[currentIndex][type] = value;
    saveData();
    closeMenu();
    render();
}

function cancelEdit() {
    closeMenu();
    render();
}

function toggleCorrectAnswer() {
    closeMenu();
    data[currentIndex].showCorrectAnswer = !data[currentIndex].showCorrectAnswer;
    saveData();
    render();
}

function navigate(offset) {
    const nextIndex = currentIndex + offset;

    if (nextIndex < 0 || nextIndex >= data.length) {
        return;
    }

    closeMenu();
    currentIndex = nextIndex;
    data[currentIndex].showCorrectAnswer = false;
    saveData();
    saveCurrentIndex();
    render();
}

function addQuestion() {
    data.push({
        question: `New ${itemLabel}`,
        answer: "",
        correctAnswer: "",
        section: "Warm-up",
        showCorrectAnswer: false
    });
    currentIndex = data.length - 1;
    saveData();
    saveCurrentIndex();
    render();
    startEdit("question");
}

function duplicateQuestion() {
    closeMenu();
    const copy = {
        question: data[currentIndex].question,
        answer: data[currentIndex].answer,
        correctAnswer: data[currentIndex].correctAnswer,
        section: data[currentIndex].section,
        showCorrectAnswer: false
    };
    data.splice(currentIndex + 1, 0, copy);
    currentIndex += 1;
    saveData();
    saveCurrentIndex();
    render();
}

function moveQuestion(offset) {
    const targetIndex = currentIndex + offset;

    closeMenu();

    if (targetIndex < 0 || targetIndex >= data.length) {
        return;
    }

    [data[currentIndex], data[targetIndex]] = [data[targetIndex], data[currentIndex]];
    currentIndex = targetIndex;
    saveData();
    saveCurrentIndex();
    render();
}

function deleteQuestion() {
    closeMenu();
    data.splice(currentIndex, 1);
    currentIndex = Math.min(currentIndex, Math.max(data.length - 1, 0));
    saveData();
    saveCurrentIndex();
    render();
}

document.addEventListener("click", event => {
    if (!event.target.closest(".menu-wrapper")) {
        closeMenu();
    }
});

loadInitialData().then(initialData => {
    data = initialData;
    render();
});
</script>

</body>
</html>
