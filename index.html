<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root {
    color-scheme: light dark;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: transparent;
    color: inherit;

    padding: 10px;
}

/* =========================
   QUESTION
========================= */

.question-wrapper {
    margin-bottom: 24px;
}

.question-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 6px;
}

.icon-btn {
    border: none;
    background: transparent;
    color: inherit;

    cursor: pointer;

    opacity: .35;

    font-size: 13px;

    transition: opacity .15s;
}

.question-wrapper:hover .icon-btn {
    opacity: .75;
}

.icon-btn:hover {
    opacity: 1;
}

.question-display {
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.question-editor {
    display: none;
}

.question-editor textarea {
    width: 100%;
    min-height: 120px;

    border: 1px solid rgba(128,128,128,.25);
    border-radius: 8px;

    padding: 10px;

    background: transparent;
    color: inherit;

    font-family: inherit;
    font-size: 16px;
    line-height: 1.6;

    resize: vertical;
}

.save-question-btn {
    margin-top: 10px;

    border: 1px solid rgba(128,128,128,.3);
    border-radius: 6px;

    background: transparent;
    color: inherit;

    padding: 6px 12px;

    cursor: pointer;
}

/* =========================
   ANSWER
========================= */

.answer-section {
    margin-top: 10px;
}

.answer-box {
    width: 100%;
    min-height: 250px;

    border: none;
    outline: none;

    background: transparent;
    color: inherit;

    font-size: 16px;
    line-height: 1.7;

    resize: vertical;

    font-family: inherit;
}

.answer-box::placeholder {
    opacity: .5;
}

/* =========================
   FOOTER
========================= */

.toolbar {
    margin-top: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    flex-wrap: wrap;
    gap: 12px;

    font-size: 13px;
    opacity: .7;
}

.stats {
    display: flex;
    gap: 16px;
}

.controls {
    display: flex;
    gap: 8px;
}

button {
    background: transparent;
    color: inherit;

    border: 1px solid rgba(128,128,128,.35);
    border-radius: 6px;

    padding: 5px 10px;

    cursor: pointer;
}

button:hover {
    opacity: .85;
}

</style>

</head>
<body>

<!-- QUESTION -->

<div class="question-wrapper">

    <div class="question-header">
        <button id="editQuestionBtn" class="icon-btn">
            ✏️ Edit Question
        </button>
    </div>

    <div id="questionDisplay" class="question-display">
        Click "Edit Question" to add a question.
    </div>

    <div id="questionEditor" class="question-editor">

        <textarea
            id="questionInput"
            placeholder="Paste your question here..."
        ></textarea>

        <button
            id="saveQuestionBtn"
            class="save-question-btn">
            Save Question
        </button>

    </div>

</div>

<!-- ANSWER -->

<div class="answer-section">

    <textarea
        id="answer"
        class="answer-box"
        placeholder="Type your answer here..."
    ></textarea>

</div>

<!-- FOOTER -->

<div class="toolbar">

    <div class="stats">
        <span id="wordCount">0 words</span>
        <span id="charCount">0 characters</span>
        <span id="status">Saved</span>
    </div>

    <div class="controls">
        <button id="clearAnswerBtn">
            Clear Answer
        </button>
    </div>

</div>

<script>

// ====================================
// QUESTION ID
// ====================================

const params = new URLSearchParams(window.location.search);

const lessonId =
    params.get("id") || "default";

const QUESTION_KEY =
    `study-question-${lessonId}`;

const ANSWER_KEY =
    `study-answer-${lessonId}`;

// ====================================
// ELEMENTS
// ====================================

const questionDisplay =
    document.getElementById("questionDisplay");

const questionEditor =
    document.getElementById("questionEditor");

const questionInput =
    document.getElementById("questionInput");

const editQuestionBtn =
    document.getElementById("editQuestionBtn");

const saveQuestionBtn =
    document.getElementById("saveQuestionBtn");

const answerBox =
    document.getElementById("answer");

const wordCount =
    document.getElementById("wordCount");

const charCount =
    document.getElementById("charCount");

const status =
    document.getElementById("status");

const clearAnswerBtn =
    document.getElementById("clearAnswerBtn");

// ====================================
// QUESTION LOAD
// ====================================

const savedQuestion =
    localStorage.getItem(QUESTION_KEY);

if (savedQuestion) {
    questionDisplay.textContent =
        savedQuestion;
    questionInput.value =
        savedQuestion;
}

// ====================================
// QUESTION EDIT
// ====================================

editQuestionBtn.addEventListener("click", () => {

    questionEditor.style.display =
        "block";

    questionDisplay.style.display =
        "none";
});

saveQuestionBtn.addEventListener("click", () => {

    const q =
        questionInput.value.trim();

    if (!q) return;

    localStorage.setItem(
        QUESTION_KEY,
        q
    );

    questionDisplay.textContent = q;

    questionDisplay.style.display =
        "block";

    questionEditor.style.display =
        "none";
});

// ====================================
// ANSWER LOAD
// ====================================

answerBox.value =
    localStorage.getItem(ANSWER_KEY) || "";

// ====================================
// STATS
// ====================================

function updateStats() {

    const trimmed =
        answerBox.value.trim();

    const words =
        trimmed
        ? trimmed.split(/\s+/).length
        : 0;

    wordCount.textContent =
        `${words} words`;

    charCount.textContent =
        `${answerBox.value.length} characters`;
}

function saveAnswer() {

    localStorage.setItem(
        ANSWER_KEY,
        answerBox.value
    );

    updateStats();

    const now = new Date();

    status.textContent =
        `Saved ${now.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
        })}`;
}

answerBox.addEventListener(
    "input",
    saveAnswer
);

// ====================================
// CLEAR
// ====================================

clearAnswerBtn.addEventListener("click", () => {

    answerBox.value = "";

    localStorage.removeItem(
        ANSWER_KEY
    );

    updateStats();

    status.textContent =
        "Answer Cleared";
});

// ====================================

updateStats();

</script>

</body>
</html>
