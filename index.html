<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    color-scheme: light dark;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    color: inherit;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
textarea {
    font: inherit;
}

textarea {
    overflow: hidden;
}

#questions {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.question-card {
    border-bottom: 1px solid rgba(128, 128, 128, .14);
    padding: 2px 0;
}

.question-header {
    position: relative;
    display: flex;
    align-items: flex-start;
    min-height: 28px;
}

.question-display {
    flex: 1;
    min-width: 0;
    padding: 3px 0;
    color: inherit;
    cursor: pointer;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
}

.question-display::before {
    display: inline-block;
    width: 16px;
    color: inherit;
    content: "▶";
    font-size: 11px;
    opacity: .6;
    transform: translateY(-1px);
}

.question-card.expanded .question-display::before {
    content: "▼";
}

.menu-wrapper {
    position: relative;
    flex: 0 0 auto;
    opacity: 0;
    transition: opacity .12s ease;
}

.question-header:hover .menu-wrapper,
.menu-wrapper:focus-within,
.menu-wrapper.menu-visible {
    opacity: 1;
}

.menu-button {
    border: 0;
    border-radius: 4px;
    padding: 2px 5px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 17px;
    line-height: 1.2;
    opacity: .5;
}

.menu-button:hover,
.menu-button:focus-visible {
    background: rgba(128, 128, 128, .1);
    opacity: 1;
    outline: none;
}

.menu {
    position: absolute;
    top: 24px;
    right: 0;
    z-index: 10;
    display: none;
    min-width: 150px;
    overflow: hidden;
    border: 1px solid rgba(128, 128, 128, .18);
    border-radius: 6px;
    background: Canvas;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
}

.menu.open {
    display: block;
}

.menu-item {
    display: block;
    width: 100%;
    border: 0;
    padding: 7px 10px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
}

.menu-item:hover,
.menu-item:focus-visible {
    background: rgba(128, 128, 128, .1);
    outline: none;
}

.question-body {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition:
        grid-template-rows .2s ease,
        opacity .15s ease;
}

.question-card.expanded .question-body {
    grid-template-rows: 1fr;
    opacity: 1;
}

.question-body-inner {
    min-height: 0;
    overflow: hidden;
    padding-left: 16px;
}

.question-body-inner > * {
    max-width: 100%;
}

.answer-box {
    display: block;
    width: 100%;
    min-height: 24px;
    margin: 0;
    overflow: hidden;
    border: 0;
    outline: 0;
    padding: 2px 0 0;
    resize: none;
    background: transparent;
    color: inherit;
    font-size: 15px;
    line-height: 1.5;
}

.answer-box::placeholder {
    opacity: .4;
}

.correct-toggle {
    display: block;
    border: 0;
    padding: 2px 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 12px;
    opacity: .55;
}

.correct-toggle:hover,
.correct-toggle:focus-visible {
    opacity: .9;
    outline: none;
    text-decoration: underline;
}

.correct-answer {
    display: none;
    margin: 2px 0 4px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.45;
}

.correct-answer.visible {
    display: block;
}

.correct-label {
    display: block;
    margin-bottom: 1px;
    font-size: 12px;
    opacity: .55;
}

.correct-editor-container {
    display: none;
    padding: 3px 0 5px;
}

.correct-editor-container.visible {
    display: block;
}

.correct-editor {
    display: block;
    width: 100%;
    min-height: 24px;
    overflow: hidden;
    border: 1px solid rgba(128, 128, 128, .22);
    border-radius: 5px;
    padding: 5px 7px;
    resize: none;
    background: transparent;
    color: inherit;
    font-size: 14px;
    line-height: 1.45;
}

.meta {
    padding: 2px 0 5px;
    color: inherit;
    font-size: 12px;
    opacity: .55;
}

.question-edit-container {
    display: none;
    padding: 2px 0 5px 16px;
}

.question-editor {
    display: block;
    width: 100%;
    min-height: 24px;
    overflow: hidden;
    border: 1px solid rgba(128, 128, 128, .22);
    border-radius: 5px;
    padding: 6px 8px;
    resize: none;
    background: transparent;
    color: inherit;
    font-size: 15px;
    line-height: 1.45;
}

.edit-actions {
    display: flex;
    gap: 6px;
    margin-top: 5px;
}

.action-btn {
    border: 1px solid rgba(128, 128, 128, .25);
    border-radius: 5px;
    padding: 5px 9px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 13px;
}

.action-btn:hover,
.action-btn:focus-visible {
    background: rgba(128, 128, 128, .1);
    outline: none;
}

.actions {
    margin-top: 7px;
}

.empty-message {
    padding: 4px 0;
    color: inherit;
    font-size: 13px;
    opacity: .55;
}

@media (prefers-reduced-motion: reduce) {
    .question-body,
    .menu-wrapper {
        transition: none;
    }
}
</style>
</head>
<body>

<div id="questions"></div>

<div class="actions">
    <button class="action-btn" id="add-question">+ Add Question</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const lessonId = params.get("id") || "default";
const STORAGE_KEY = `lesson-${lessonId}`;

let data = loadData();

function loadData() {
    const stored = localStorage.getItem(STORAGE_KEY);

    if (!stored) {
        return [];
    }

    try {
        const parsed = JSON.parse(stored);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed.map(item => ({
            question: typeof item.question === "string" ? item.question : "",
            answer: typeof item.answer === "string" ? item.answer : "",
            correctAnswer: typeof item.correctAnswer === "string"
                ? item.correctAnswer
                : "",
            expanded: item.expanded === true,
            showCorrectAnswer: item.showCorrectAnswer === true
        }));
    } catch (error) {
        console.error(`Unable to load lesson "${lessonId}".`, error);
        return [];
    }
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function countWords(text) {
    const trimmed = text.trim();
    return trimmed ? trimmed.split(/\s+/).length : 0;
}

function closeAllMenus() {
    document.querySelectorAll(".menu.open").forEach(menu => {
        menu.classList.remove("open");
        menu.closest(".menu-wrapper")?.classList.remove("menu-visible");
    });
}

function autoGrow(textarea) {
    textarea.style.height = "0px";
    textarea.style.height = `${Math.max(textarea.scrollHeight, 24)}px`;
}

function createButton(text, className, handler) {
    const button = document.createElement("button");
    button.className = className;
    button.type = "button";
    button.textContent = text;
    button.addEventListener("click", event => {
        event.stopPropagation();
        handler();
    });
    return button;
}

function render() {
    const container = document.getElementById("questions");
    container.replaceChildren();

    if (data.length === 0) {
        const emptyMessage = document.createElement("div");
        emptyMessage.className = "empty-message";
        emptyMessage.textContent = 'Click "Add Question" to begin.';
        container.appendChild(emptyMessage);
        return;
    }

    data.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = `question-card${item.expanded ? " expanded" : ""}`;

        const header = document.createElement("div");
        header.className = "question-header";

        const display = document.createElement("div");
        display.className = "question-display";
        display.tabIndex = 0;
        display.setAttribute("role", "button");
        display.setAttribute("aria-expanded", String(item.expanded));
        display.textContent = item.question;
        display.addEventListener("click", () => toggleExpanded(index));
        display.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                toggleExpanded(index);
            }
        });

        const menuWrapper = document.createElement("div");
        menuWrapper.className = "menu-wrapper";

        const menuButton = createButton("⋯", "menu-button", () => {
            const menu = menuWrapper.querySelector(".menu");
            const willOpen = !menu.classList.contains("open");
            closeAllMenus();

            if (willOpen) {
                menu.classList.add("open");
                menuWrapper.classList.add("menu-visible");
            }
        });
        menuButton.setAttribute("aria-label", "Question actions");
        menuWrapper.appendChild(menuButton);

        const menu = document.createElement("div");
        menu.className = "menu";
        menu.append(
            createButton("Edit Question", "menu-item", () => startEdit(index)),
            createButton("Edit Correct Answer", "menu-item", () => startCorrectEdit(index)),
            createButton("Duplicate", "menu-item", () => duplicateQuestion(index)),
            createButton("Move Up", "menu-item", () => moveUp(index)),
            createButton("Move Down", "menu-item", () => moveDown(index)),
            createButton("Delete", "menu-item", () => deleteQuestion(index))
        );
        menuWrapper.appendChild(menu);

        header.append(display, menuWrapper);

        const editContainer = document.createElement("div");
        editContainer.className = "question-edit-container";

        const editor = document.createElement("textarea");
        editor.className = "question-editor";
        editor.value = item.question;
        editor.setAttribute("aria-label", "Edit question");
        editor.addEventListener("input", () => autoGrow(editor));

        const editActions = document.createElement("div");
        editActions.className = "edit-actions";
        editActions.append(
            createButton("Save", "action-btn", () => saveQuestion(index)),
            createButton("Cancel", "action-btn", () => cancelEdit(index))
        );
        editContainer.append(editor, editActions);

        const body = document.createElement("div");
        body.className = "question-body";

        const bodyInner = document.createElement("div");
        bodyInner.className = "question-body-inner";

        const answer = document.createElement("textarea");
        answer.className = "answer-box";
        answer.placeholder = "Type your answer here...";
        answer.value = item.answer;
        answer.setAttribute("aria-label", "Answer");
        answer.addEventListener("input", event => {
            updateAnswer(index, event.target.value);
            autoGrow(answer);
        });

        const correctToggle = createButton(
            item.showCorrectAnswer ? "Hide Correct Answer" : "Show Correct Answer",
            "correct-toggle",
            () => toggleCorrectAnswer(index)
        );

        const correctAnswer = document.createElement("div");
        correctAnswer.className = `correct-answer${item.showCorrectAnswer ? " visible" : ""}`;

        const correctLabel = document.createElement("span");
        correctLabel.className = "correct-label";
        correctLabel.textContent = "Correct Answer:";

        const correctText = document.createElement("span");
        correctText.textContent = item.correctAnswer;
        correctAnswer.append(correctLabel, correctText);

        const correctEditorContainer = document.createElement("div");
        correctEditorContainer.className = "correct-editor-container";

        const correctEditor = document.createElement("textarea");
        correctEditor.className = "correct-editor";
        correctEditor.value = item.correctAnswer;
        correctEditor.setAttribute("aria-label", "Edit correct answer");
        correctEditor.addEventListener("input", () => autoGrow(correctEditor));

        const correctEditActions = document.createElement("div");
        correctEditActions.className = "edit-actions";
        correctEditActions.append(
            createButton("Save", "action-btn", () => saveCorrectAnswer(index)),
            createButton("Cancel", "action-btn", () => cancelCorrectEdit(index))
        );

        correctEditorContainer.append(correctEditor, correctEditActions);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${countWords(item.answer)} words`;

        bodyInner.append(
            answer,
            correctToggle,
            correctAnswer,
            correctEditorContainer,
            meta
        );
        body.appendChild(bodyInner);
        card.append(header, editContainer, body);
        container.appendChild(card);

        autoGrow(answer);
        autoGrow(editor);
        autoGrow(correctEditor);
    });
}

function toggleExpanded(index) {
    closeAllMenus();
    data[index].expanded = !data[index].expanded;
    saveData();
    render();
}

function startEdit(index) {
    closeAllMenus();

    const card = document.querySelectorAll(".question-card")[index];
    const display = card.querySelector(".question-display");
    const editContainer = card.querySelector(".question-edit-container");
    const editor = card.querySelector(".question-editor");

    display.style.display = "none";
    editContainer.style.display = "block";
    editor.focus();
    editor.select();
}

function startCorrectEdit(index) {
    closeAllMenus();
    data[index].expanded = true;
    saveData();
    render();

    const card = document.querySelectorAll(".question-card")[index];
    const editorContainer = card.querySelector(".correct-editor-container");
    const editor = card.querySelector(".correct-editor");

    editorContainer.classList.add("visible");
    editor.focus();
    editor.select();
}

function saveQuestion(index) {
    const card = document.querySelectorAll(".question-card")[index];
    const value = card.querySelector(".question-editor").value.trim();

    if (!value) {
        return;
    }

    data[index].question = value;
    saveData();
    closeAllMenus();
    render();
}

function saveCorrectAnswer(index) {
    const card = document.querySelectorAll(".question-card")[index];
    const editor = card.querySelector(".correct-editor");

    data[index].correctAnswer = editor.value.trim();
    saveData();
    closeAllMenus();
    render();
}

function cancelEdit(index) {
    closeAllMenus();
    render();
}

function cancelCorrectEdit(index) {
    closeAllMenus();
    render();
}

function updateAnswer(index, value) {
    data[index].answer = value;
    saveData();

    const card = document.querySelectorAll(".question-card")[index];
    card.querySelector(".meta").textContent = `${countWords(value)} words`;
}

function toggleCorrectAnswer(index) {
    closeAllMenus();
    data[index].showCorrectAnswer = !data[index].showCorrectAnswer;
    saveData();
    render();
}

function addQuestion() {
    data.push({
        question: "New Question",
        answer: "",
        correctAnswer: "",
        expanded: false,
        showCorrectAnswer: false
    });
    saveData();
    render();
    startEdit(data.length - 1);
}

function deleteQuestion(index) {
    closeAllMenus();
    data.splice(index, 1);
    saveData();
    render();
}

function duplicateQuestion(index) {
    closeAllMenus();
    data.splice(index + 1, 0, {
        question: data[index].question,
        answer: data[index].answer,
        correctAnswer: data[index].correctAnswer,
        expanded: false,
        showCorrectAnswer: false
    });
    saveData();
    render();
}

function moveUp(index) {
    closeAllMenus();

    if (index === 0) {
        return;
    }

    [data[index - 1], data[index]] = [data[index], data[index - 1]];
    saveData();
    render();
}

function moveDown(index) {
    closeAllMenus();

    if (index >= data.length - 1) {
        return;
    }

    [data[index], data[index + 1]] = [data[index + 1], data[index]];
    saveData();
    render();
}

document.getElementById("add-question").addEventListener("click", addQuestion);

document.addEventListener("click", event => {
    if (!event.target.closest(".menu-wrapper")) {
        closeAllMenus();
    }
});

render();
</script>

</body>
</html>
